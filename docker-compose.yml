# 园区光纤环网拓扑工作台
#
# 服务：
#   web     长期运行的页面服务，宿主机端口可用环境变量 WEB_PORT 覆盖（默认 8080）
#   verify  一次性验收服务：类型检查 + Vitest（删边预言机差分）+ 上限 5 秒性能预算，
#           通过即退出（退出码 0），用于 CI / 本地 `docker compose --profile verify run verify`
#
# 示例：
#   WEB_PORT=9000 docker compose up --build web
#   docker compose --profile verify build verify && docker compose --profile verify run --rm verify

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ring-topology-workbench:latest
    container_name: ring-topology-web
    ports:
      # 宿主机 WEB_PORT（可覆盖）→ 容器内 8080
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5

  verify:
    profiles: ['verify']
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: ring-topology-verify:latest
    container_name: ring-topology-verify
    # 一次性服务：不映射端口、不重启；退出码即验收结论
    restart: 'no'
